<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button id="toggle-modal">Add new task</button></div>
        </nav>
        <section class="board">
            <!-- Todo -->
            <div id="todo" class="task-column">

                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">count</div>
                </div>
            </div>
            <!-- progress -->
            <div id="progress" class="task-column ">

                <div class="heading">
                    <div class="left">Tn Progress</div>
                    <div class="right">count</div>
                </div>

            </div>
            <!-- done -->
            <div id="done" class="task-column">

                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>

            </div>
            
        </section>

    </main>

    <div class="modal add-new-task">
            <div class="bg"></div>
            <div class="center">
                <input type="text" placeholder="Task Title" id="task-title-input">
                <textarea placeholder="Task Description" id="task-description-input"></textarea>
                <button id="add-new-task" class="add-new-task">Add Task</button>
            </div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
